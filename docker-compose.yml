services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gvrm_iex
      POSTGRES_USER: gvrm
      POSTGRES_PASSWORD: gvrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
